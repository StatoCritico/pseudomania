# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudogate-server"
version = "0.1.0"
description = "Pseudomania (Server edition): API di pseudonimizzazione reversibile per claude.ai"
readme = { text = "Vedi SPEC.md nella radice del repository.", content-type = "text/plain" }
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "SQLAlchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.15.0",
    "cryptography==50.0.1",
    "PyYAML==6.0.3",
    "lxml==6.1.3",
    "PyMuPDF==1.28.2",
    "langfuse==5.1.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "python-docx==1.2.0", "openpyxl==3.1.5"]

[project.scripts]
pseudogate = "pseudogate.__main__:_cli"

[tool.setuptools.packages.find]
include = ["pseudogate*"]

[tool.setuptools.package-data]
"pseudogate.vendor.rizzo_pdf" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
