# SPDX-License-Identifier: AGPL-3.0-or-later
#
# FILTRO CATEGORIE PARTICOLARI DI DATI - BOZZA da validare con il DPO.
#
# Art. 9 GDPR (dati che rivelano origine razziale o etnica, opinioni politiche,
# convinzioni religiose o filosofiche, appartenenza sindacale, dati genetici,
# biometrici, relativi alla salute, alla vita o all'orientamento sessuale) e
# art. 10 GDPR (dati relativi a condanne penali e reati) NON possono essere
# inviati a claude.ai, nemmeno pseudonimizzati: il contesto (es. "il dipendente
# [FULLNAME_1] è in malattia per depressione") resta un dato particolare.
#
# Funzionamento:
#  - il filtro gira PRIMA del rilevatore, sul testo originale e sul testo estratto
#    dai file; alla prima categoria con action "block" la richiesta è bloccata
#    (blocked=true) e l'utente riceve "message" in italiano; nel registro finisce
#    solo l'id della categoria (block_category), mai il testo;
#  - action "log": non blocca, registra solo l'evento (utile per tarare la lista);
#  - "terms": parole o locuzioni, confronto senza maiuscole/minuscole, a confini di
#    parola; un "*" finale indica un prefisso (es. "sieropositiv*");
#  - "patterns": espressioni regolari Python aggiuntive.
#
# ATTENZIONE: una lista di parole produce falsi positivi (es. "malattia" in una
# circolare generale sulle assenze) e falsi negativi (sinonimi, refusi, sigle).
# Va affinata con il DPO e con le segnalazioni "falso positivo" degli utenti
# (evento report_false_positive). Dopo ogni modifica aggiornare "version".

version: "2026-10-30-bozza-1"

# Segnaposto disponibili: {label} {article} {term}
message: >-
  Il contenuto sembra includere {label} (art. {article} GDPR), ad esempio «{term}».
  Per le regole dell'ente questi dati non possono essere inviati a un servizio di IA
  esterno, nemmeno pseudonimizzati. Rimuovi o generalizza questi riferimenti e
  riprova. Se pensi che il blocco sia sbagliato, segnalalo con il pulsante
  «Segnala blocco errato» nel pannello laterale di Pseudomania.

categories:
  - id: salute
    article: "9"
    label: "dati relativi alla salute"
    action: block
    terms:
      - "diagnosi"
      - "diagnosticat*"
      - "patologi*"
      - "certificato medico"
      - "certificati medici"
      - "certificato di malattia"
      - "assenza per malattia"
      - "assenze per malattia"
      - "congedo per malattia"
      - "in malattia"
      - "visita fiscale"
      - "visita medica"
      - "visite mediche"
      - "medico competente"
      - "sorveglianza sanitaria"
      - "giudizio di idoneità"
      - "inidoneità"
      - "inidone*"
      - "referto"
      - "referti"
      - "cartella clinica"
      - "fascicolo sanitario"
      - "anamnesi"
      - "ricoverat*"
      - "ricovero"
      - "pronto soccorso"
      - "day hospital"
      - "intervento chirurgico"
      - "terapia"
      - "terapie"
      - "chemioterapia"
      - "radioterapia"
      - "dialisi"
      - "psicoterapia"
      - "psichiatric*"
      - "neuropsichiatr*"
      - "tumore"
      - "tumori"
      - "cancro"
      - "carcinoma"
      - "neoplasi*"
      - "oncologic*"
      - "leucemia"
      - "linfoma"
      - "HIV"
      - "AIDS"
      - "sieropositiv*"
      - "epatite"
      - "tubercolosi"
      - "diabete"
      - "diabetic*"
      - "epilessia"
      - "sclerosi multipla"
      - "Alzheimer"
      - "Parkinson"
      - "demenza"
      - "depressione"
      - "ansia generalizzata"
      - "disturbo bipolare"
      - "schizofreni*"
      - "anoressia"
      - "bulimia"
      - "autismo"
      - "autistic*"
      - "ADHD"
      - "dislessi*"
      - "disturbi specifici dell'apprendimento"
      - "tossicodipenden*"
      - "alcoldipenden*"
      - "SerD"
      - "SERT"
      - "gravidanza"
      - "in stato interessante"
      - "interruzione volontaria di gravidanza"
      - "aborto"
      - "procreazione assistita"
      - "infortunio sul lavoro"
      - "malattia professionale"
      - "esenzione ticket"
      - "vaccinazione"
      - "positivo al covid"
      - "positiva al covid"
    patterns:
      # codici ICD-10 vicino a parole cliniche (es. "diagnosi F32.1")
      - "\\b(?:ICD-?10|ICD-?9)\\b"

  - id: disabilita
    article: "9"
    label: "dati relativi alla salute (disabilità e invalidità)"
    action: block
    terms:
      - "disabilità"
      - "disabile"
      - "disabili"
      - "diversamente abile"
      - "portatore di handicap"
      - "portatrice di handicap"
      - "handicap"
      - "invalidità civile"
      - "invalido civile"
      - "invalida civile"
      - "percentuale di invalidità"
      - "indennità di accompagnamento"
      - "legge 104"
      - "L. 104/1992"
      - "L. 104/92"
      - "permessi 104"
      - "categorie protette"
      - "collocamento mirato"
      - "L. 68/1999"
      - "insegnante di sostegno"
      - "piano educativo individualizzato"
    patterns:
      - "\\blegge\\s+(?:n\\.?\\s*)?104(?:/(?:19)?92)?\\b"
      - "\\bart\\.?\\s*3,?\\s*comm[ai]\\s*3\\b"

  - id: genetici_biometrici
    article: "9"
    label: "dati genetici o biometrici"
    action: block
    terms:
      - "test genetico"
      - "test genetici"
      - "analisi del DNA"
      - "profilo genetico"
      - "mutazione genetica"
      - "malattia genetica"
      - "impronte digitali"
      - "impronta digitale"
      - "riconoscimento facciale"
      - "dati biometrici"
      - "template biometrico"

  - id: origine_etnica
    article: "9"
    label: "dati che rivelano l'origine razziale o etnica"
    action: block
    terms:
      - "origine etnica"
      - "origini etniche"
      - "appartenenza etnica"
      - "etnia"
      - "origine razziale"
      - "comunità rom"
      - "rom e sinti"
      - "di razza"

  - id: opinioni_politiche
    article: "9"
    label: "dati che rivelano opinioni politiche"
    action: block
    terms:
      - "iscritto al partito"
      - "iscritta al partito"
      - "iscrizione al partito"
      - "tessera di partito"
      - "tesserato del partito"
      - "orientamento politico"
      - "opinioni politiche"

  - id: convinzioni_religiose
    article: "9"
    label: "dati che rivelano convinzioni religiose o filosofiche"
    action: block
    terms:
      - "convinzioni religiose"
      - "credo religioso"
      - "confessione religiosa"
      - "appartenenza religiosa"
      - "fede religiosa"
      - "è musulman*"
      - "è ebre*"
      - "è testimone di Geova"
      - "testimoni di Geova"
      - "ateo"
      - "atea"
      - "esonero dall'insegnamento della religione cattolica"
      - "dieta religiosa"
      - "menu halal"
      - "menu kosher"

  - id: sindacale
    article: "9"
    label: "dati che rivelano l'appartenenza sindacale"
    action: block
    terms:
      - "iscritto al sindacato"
      - "iscritta al sindacato"
      - "iscrizione sindacale"
      - "iscritti al sindacato"
      - "tessera sindacale"
      - "delega sindacale"
      - "trattenuta sindacale"
      - "quota sindacale"
      - "permesso sindacale"
      - "permessi sindacali"
      - "distacco sindacale"
      - "dirigente sindacale"
      - "RSU"
      - "rappresentante sindacale"

  - id: vita_sessuale
    article: "9"
    label: "dati relativi alla vita sessuale o all'orientamento sessuale"
    action: block
    terms:
      - "orientamento sessuale"
      - "vita sessuale"
      - "omosessual*"
      - "eterosessual*"
      - "bisessual*"
      - "gay"
      - "lesbica"
      - "transgender"
      - "transessual*"
      - "rettificazione di attribuzione di sesso"
      - "carriera alias"
      - "identità di genere"
      - "unione civile"

  - id: giudiziari
    article: "10"
    label: "dati relativi a condanne penali e reati"
    action: block
    terms:
      - "casellario giudiziale"
      - "certificato del casellario"
      - "carichi pendenti"
      - "precedenti penali"
      - "condanna penale"
      - "condannat*"
      - "sentenza penale"
      - "procedimento penale"
      - "processo penale"
      - "azione penale"
      - "reato"
      - "reati"
      - "imputat*"
      - "indagat*"
      - "avviso di garanzia"
      - "informazione di garanzia"
      - "rinvio a giudizio"
      - "misura cautelare"
      - "custodia cautelare"
      - "arresti domiciliari"
      - "arrestat*"
      - "detenut*"
      - "pena detentiva"
      - "reclusione"
      - "patteggiamento"
      - "decreto penale di condanna"
      - "messa alla prova"
      - "querela"
      - "denuncia penale"
      - "notizia di reato"
      - "pubblico ministero"
      - "procura della Repubblica"
      - "misure di prevenzione"
      - "interdittiva antimafia"
      - "DASPO"
    patterns:
      # articoli del codice penale / di procedura penale: "art. 640 c.p.", "art. 335 c.p.p."
      - "\\bart(?:t)?\\.?\\s*\\d+(?:-?\\w+)?\\s*(?:,\\s*comma\\s*\\d+\\s*,?\\s*)?c\\.?\\s?p\\.?(?:\\s?p\\.?)?(?!\\w)"
