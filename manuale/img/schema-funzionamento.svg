<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">
  <title>Come funziona Pseudomania</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- Zona: il tuo computer / la tua organizzazione -->
  <rect x="20" y="20" width="560" height="480" rx="14" fill="#eef6ee" stroke="#5a9a5a" stroke-dasharray="6 4"/>
  <text x="40" y="46" font-weight="bold" fill="#2f6b2f">Dove restano i dati reali</text>
  <text x="40" y="66" font-size="12" fill="#2f6b2f">il tuo PC (Personal) · il PC e la rete interna dell'organizzazione (Server edition)</text>

  <!-- Zona: Internet / fornitore -->
  <rect x="610" y="20" width="330" height="480" rx="14" fill="#fff4e6" stroke="#c8873a" stroke-dasharray="6 4"/>
  <text x="630" y="46" font-weight="bold" fill="#8a5418">Fornitore del servizio di IA</text>
  <text x="630" y="66" font-size="12" fill="#8a5418">riceve solo testo con segnaposto</text>

  <!-- Browser -->
  <rect x="45" y="90" width="270" height="190" rx="10" fill="#ffffff" stroke="#333"/>
  <text x="60" y="114" font-weight="bold">Chrome + Pseudomania</text>
  <text x="60" y="142">Scrivi:</text>
  <text x="60" y="162" font-size="13" fill="#444">«Lettera a Mario Rossi,</text>
  <text x="60" y="180" font-size="13" fill="#444"> mario.rossi@example.it»</text>
  <text x="60" y="214">Leggi la risposta:</text>
  <text x="60" y="234" font-size="13" fill="#2f6b2f">«Gentile <tspan font-weight="bold">Mario Rossi</tspan>, …»</text>
  <text x="60" y="262" font-size="11" fill="#666">dizionario cifrato:</text><text x="60" y="275" font-size="11" fill="#666">[FULLNAME_1] = Mario Rossi</text>

  <!-- Rilevatore -->
  <rect x="45" y="330" width="250" height="140" rx="10" fill="#ffffff" stroke="#333"/>
  <text x="60" y="354" font-weight="bold">Riconoscimento dei dati</text>
  <text x="60" y="380" font-size="13">Personal: app Rizzo-PII sul PC</text>
  <text x="60" y="398" font-size="13" fill="#666">(http://127.0.0.1:5005)</text>
  <text x="60" y="424" font-size="13">Server edition: server Pseudomania</text>
  <text x="60" y="442" font-size="13" fill="#666">su VM interna (Rizzo-PII,</text>
  <text x="60" y="460" font-size="13" fill="#666">dizionario cifrato, registro)</text>

  <!-- frecce browser <-> rilevatore -->
  <line x1="130" y1="282" x2="130" y2="326" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="210" y1="328" x2="210" y2="284" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="18" y="306" font-size="12" fill="#333" transform="translate(0,0)"><tspan x="62">① testo</tspan></text>
  <text x="218" y="306" font-size="12" fill="#333">② segnaposto</text>

  <!-- Testo pseudonimizzato -->
  <rect x="335" y="140" width="230" height="70" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="347" y="165" font-size="13">«Lettera a [FULLNAME_1],</text>
  <text x="347" y="185" font-size="13"> [EMAIL_1]»</text>
  <text x="347" y="204" font-size="11" fill="#666">ciò che parte davvero</text>

  <!-- claude.ai -->
  <rect x="660" y="100" width="240" height="190" rx="10" fill="#ffffff" stroke="#333"/>
  <text x="680" y="140" font-weight="bold">claude.ai</text>
  <text x="680" y="176" font-size="13">riceve:</text>
  <text x="680" y="196" font-size="13" fill="#444">«Lettera a [FULLNAME_1], …»</text>
  <text x="680" y="232" font-size="13">risponde:</text>
  <text x="680" y="252" font-size="13" fill="#444">«Gentile [FULLNAME_1], …»</text>

  <!-- frecce verso/da claude -->
  <line x1="316" y1="125" x2="656" y2="125" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="580" y="117" font-size="12">③ invio</text>
  <line x1="656" y1="250" x2="318" y2="250" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="242" font-size="12">④ risposta con segnaposto</text>
  <text x="330" y="272" font-size="12" fill="#2f6b2f">⑤ l'estensione rimette i valori reali</text>
  <text x="330" y="288" font-size="12" fill="#2f6b2f">    solo nella tua pagina</text>

  <!-- Non protetto -->
  <rect x="640" y="350" width="280" height="130" rx="10" fill="#fdecea" stroke="#c0392b"/>
  <text x="655" y="374" font-weight="bold" fill="#a12a1c">NON passano da Pseudomania</text>
  <text x="655" y="398" font-size="12">• preferenze del profilo Claude</text>
  <text x="655" y="416" font-size="12">• richieste di ricerca web di Claude</text>
  <text x="655" y="434" font-size="12">• connettori, memoria (da spegnere)</text>
  <text x="655" y="452" font-size="12">• app desktop/mobile, altri browser</text>
  <text x="655" y="470" font-size="12">• contesto che identifica senza nomi</text>
</svg>
