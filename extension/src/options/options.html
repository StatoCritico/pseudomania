<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Impostazioni di Pseudomania</title>
  <link rel="stylesheet" href="../ui/common.css">
  <style>
    body { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .row { margin-top: 18px; }
    #msg { margin-top: 12px; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 18px 0; padding: 10px 14px; }
    legend { font-weight: 600; padding: 0 4px; }
    fieldset label { font-weight: 400; display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
    fieldset label input { margin-top: 3px; }
    fieldset label.disabled { opacity: .55; }
    fieldset .ttl { font-weight: 600; }
    fieldset > .help { margin: 0 0 4px; }
    dialog { border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; max-width: 480px;
             width: calc(100% - 32px); background: var(--bg); color: var(--fg); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    dialog h2 { font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--ko); margin: 0 0 10px; }
    dialog p { margin: 0 0 14px; }
    dialog .row { justify-content: flex-end; margin-top: 0; }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <p id="edition" class="muted"></p>
  <p id="managed" class="warn" hidden></p>
  <form id="form" hidden>
    <label for="rizzoUrl" id="lblRizzo"></label>
    <input type="url" id="rizzoUrl" placeholder="http://127.0.0.1:5005" required>
    <div class="help" id="helpRizzo"></div>
    <div class="row">
      <button class="btn primary" type="submit" id="btnSave"></button>
      <button class="btn" type="button" id="btnTest"></button>
    </div>
  </form>
  <p id="serverInfo" class="small" hidden></p>
  <fieldset id="activation" hidden><legend id="actTitle"></legend><div id="actOptions"></div></fieldset>
  <fieldset id="images" hidden><legend id="imgTitle"></legend><div id="imgOptions"></div><p id="imgManaged" class="small" hidden></p></fieldset>
  <fieldset id="keepTypes" hidden><legend id="keepTitle"></legend><p id="keepHelp" class="help"></p><div id="keepOptions"></div></fieldset>
  <fieldset id="pdfImages" hidden><legend id="pdfImgTitle"></legend><p id="pdfImgHelp" class="help"></p><div id="pdfImgOptions"></div></fieldset>
  <dialog id="pdfKeepDlg" aria-labelledby="pdfKeepTitle" aria-describedby="pdfKeepText">
    <h2 id="pdfKeepTitle"></h2>
    <p id="pdfKeepText"></p>
    <div class="row">
      <button class="btn" type="button" id="pdfKeepCancel" autofocus></button>
      <button class="btn danger" type="button" id="pdfKeepOk"></button>
    </div>
  </dialog>
  <p id="msg" role="status"></p>
  <section id="log" hidden>
    <h2 id="logTitle"></h2>
    <p id="logHelp" class="small muted"></p>
    <button class="btn" type="button" id="btnLog"></button>
    <div style="max-height:360px;overflow:auto;margin-top:10px">
      <table id="logTable" class="small" style="width:100%;border-collapse:collapse"></table>
    </div>
  </section>
  <section id="about">
    <h2 id="aboutTitle"></h2>
    <p id="aboutExt" class="small"></p>
    <p class="small"><span id="aboutSiteLbl"></span> <a id="aboutSite" target="_blank" rel="noopener noreferrer"></a></p>
    <p class="small" id="aboutSrcRow"><span id="aboutSrcLbl"></span> <a id="aboutSrc" target="_blank" rel="noopener noreferrer"></a></p>
    <p id="aboutLic" class="small muted"></p>
  </section>
  <script src="../shared/strings.js"></script>
  <script src="../shared/config.js"></script>
  <script src="options.js"></script>
</body>
</html>
